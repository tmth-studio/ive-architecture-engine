name: verify

on:
  push:
  pull_request:

jobs:
  tier-1-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 verifier/verify.py examples/synthetic-venture/architecture.json
      - run: python3 -m unittest discover -s tests
